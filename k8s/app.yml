apiVersion: apps/v1
kind: Deployment 
metadata:
  name: demo-app
spec: 
  replicas: 2
  selector: 
    matchLabels: 
      app: demo-app
  template: 
    metadata: 
      labels:
        app: demo-app
    spec: 
      containers: 
        - name: demo-app
          image: demo-app:0.1
          imagePullPolicy: IfNotPresent
          ports: 
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata: 
  name: demo-app
spec: 
  selector: 
    app: demo-app
  ports: 
    - port: 80
      targetPort: 5000